
name: Update Toos

permissions:
  contents: write
  actions: write
  pull-requests: write

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout My Repository
      uses: actions/checkout@v7
      with:
        repository: chenyee888/tvbox-Beauty
        ref: main
        token: ${{ secrets.GIT_TOKEN }}
        fetch-depth: 0

    - name: Delete old workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 1
        keep_minimum_runs: 3

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f .github/requirements.txt ]; then
          pip install -r .github/requirements.txt
        fi
        pip install aiohttp

    - name: Configure Git Identity
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Run M3U and Push Changes
      run: |
        set -e

        for attempt in 1 2 3; do
          echo "========== Attempt ${attempt}/3 =========="

          echo "Fetching latest main branch..."
          git fetch origin main

          echo "Resetting to latest main..."
          git reset --hard origin/main

          git clean -fd

          echo "Running M3U script..."
          python py/ssjh.py

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes detected."
            exit 0
          fi

          echo "Committing changes..."
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update m3u"

          echo "Pushing to my main branch..."
          if git push origin HEAD:main; then
            echo "M3U update pushed successfully."
            exit 0
          fi

          echo "Push failed. Will fetch the latest main and retry."
        done

        echo "Failed after 3 attempts."
        exit 1
